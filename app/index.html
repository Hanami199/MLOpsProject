<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How can I suggest you today?</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="algo-choice-bar">
        <label for="algorithm">Choose a method:</label>
        <select id="algorithm" name="algorithm">
            <option value="algo1">Algorithm 1</option>
            <option value="algo2">Algorithm 2</option>
        </select>
    </div>
    <div class="toggle-switch" id="toggleSwitch">
        <span class="icon">☀️</span>
    </div>

    <div class="container">
        <!-- Area sinistra -->
        <div class="left-panel">
            <h2>How can I suggest you today?</h2>
            <p>Insert 5 or more movies:</p>
            <form id="movieForm" autocomplete="off">
                <div class="input-wrapper">
                    <input type="text" id="movieInput" placeholder=" " />
                    <label for="movieInput" class="floating-label">Enter movie names</label>
                </div>
                <button type="submit">Suggest</button>
                <ul id="suggestions" class="suggestions-list"></ul>
            </form>
            <div id="minAlert" class="min-alert" style="display:none;">
                Please add at least 5 movies to continue.
            </div>
        </div>

            <!-- Area destra -->
        <div class="suggestion-box" id="suggestionBox">
        <!-- Qui verranno aggiunti gli elementi -->
        </div>
    </div>

    <script src="./script.js"></script>

    <footer></footer>
</body>
</html>
